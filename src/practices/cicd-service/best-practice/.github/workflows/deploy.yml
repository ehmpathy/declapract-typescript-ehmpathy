name: deploy

on:
  push:
    tags:
      - v*
    branches:
      - "main"
      - "master"
  workflow_dispatch:
    inputs:
      access:
        description: "which access do you want to deploy with?"
        type: choice
        options:
          - prep
          - prod
        required: true
        default: "prep"
      thoroughly:
        description: "should we run tests before this deployment?"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # per [workflow] x [branch, tag]
  cancel-in-progress: true #  cancel workflows for non-latest commits

permissions:
  id-token: write # required for oidc
  contents: read

jobs:
  test:
    uses: ./.github/workflows/.test.yml
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.thoroughly == 'true'
    with:
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_PREP_OIDC_ROLE_ARN }} # use aws auth via oidc, if this repo supplies it
    secrets: inherit # keyrack firewall in .test.yml filters to declared keys

  prep:
    uses: ./.github/workflows/.deploy-sls.yml
    needs: [test]
    if: |
      ((github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') || github.event.inputs.access == 'prep') &&
      always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    # github-environment is ALWAYS declared — for prep as well as prod. deployment:false (in
    # .deploy-sls.yml) keeps the gate (required reviewers, oidc claim) and suppresses the
    # PR-timeline Deployment spam, so prep declares its environment without the noise.
    with:
      access: prep
      github-environment-apply: preparation
      creds-aws-region: us-east-1
      creds-aws-role-arn-apply: ${{ vars.CREDS_CICD_AWS_PREP_OIDC_ROLE_ARN }}

  prod:
    uses: ./.github/workflows/.deploy-sls.yml
    if: |
      ((startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch') || github.event.inputs.access == 'prod') &&
      always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: [test]
    with:
      access: prod
      github-environment-apply: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'production-on-main' || 'production-on-else-apply' }} # main/tag => on-main; else => on-else-apply (actor_id-gated writer)
      creds-aws-region: us-east-1
      creds-aws-role-arn-apply: ${{ vars.CREDS_CICD_AWS_PROD_OIDC_APPLY_ROLE_ARN }}
    secrets:
      # .deploy-sls.yml declares AND uses this secret to page on a failed prod deploy/acceptance.
      # omit it and the alarm step's `if: env.PAGERDUTY_INTEGRATION_KEY` is false, so the step is
      # SKIPPED silently and prod alerts are dead. the callee marks it `required: false`, so github
      # never errors on the omission — this pass-through is what keeps the alert live.
      pagerduty-integration-key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
