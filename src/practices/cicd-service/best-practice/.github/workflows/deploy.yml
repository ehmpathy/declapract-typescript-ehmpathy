name: deploy

on:
  push:
    tags:
      - v*
    branches:
      - "main"
      - "master"
  workflow_dispatch:
    inputs:
      stage:
        description: "which stage do you want to deploy to?"
        type: choice
        options:
          - prep
          - prod
        required: true
        default: "prep"
      thoroughly:
        description: "should we run tests before this deployment?"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # per [workflow] x [branch, tag]
  cancel-in-progress: true #  cancel workflows for non-latest commits

permissions:
  id-token: write # required for oidc
  contents: read

jobs:
  test:
    uses: ./.github/workflows/.test.yml
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.thoroughly == 'true'
    with:
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_PREP_OIDC_ROLE_ARN }} # use aws auth via oidc, if this repo supplies it
    secrets: inherit # keyrack firewall in .test.yml filters to declared keys

  prep:
    uses: ./.github/workflows/.deploy-sls.yml
    needs: [test]
    if: |
      ((github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') || github.event.inputs.stage == 'prep') &&
      always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    # prep omits github-environment: the ahbode-prep-oidc role trusts any branch
    # (repo-scoped sub), so no env claim is needed — only prod gates on environment.
    with:
      stage: prep
      creds-aws-region: us-east-1
      creds-aws-role-arn-apply: ${{ vars.CREDS_CICD_AWS_PREP_OIDC_ROLE_ARN }}

  prod:
    uses: ./.github/workflows/.deploy-sls.yml
    if: |
      (startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch') || (github.event.inputs.stage == 'prod') &&
      always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: [test]
    with:
      stage: prod
      github-environment-apply: production-on-main # tags cut from main; carries the tag v* deploy policy
      creds-aws-region: us-east-1
      creds-aws-role-arn-apply: ${{ vars.CREDS_CICD_AWS_PROD_OIDC_APPLY_ROLE_ARN }}
