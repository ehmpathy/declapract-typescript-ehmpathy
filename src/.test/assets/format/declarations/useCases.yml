# minimal use cases for the format package.json pipeline test.
# .why = format is biome only (#645), with or without terraform in the usecase. these two lean use
#        cases prove both shapes converge on the biome-only chain, while each evaluates only 1-2
#        practices — not the ~40 of the real declarations tree, which blows the jest hook timeout.
use-cases:
  with-terraform:
    practices:
      - format
      - terraform-common
  without-terraform:
    practices:
      - format
