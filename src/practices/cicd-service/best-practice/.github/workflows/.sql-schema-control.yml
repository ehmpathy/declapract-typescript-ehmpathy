name: .sql-schema-control

on:
  workflow_call:
    inputs:
      stage:
        type: string
        description: "the stage to execute against"
        required: true
      github-environment-plan:
        type: string
        description: "github environment for the plan job (prod only; omit for prep — its oidc role is repo-scoped, no env claim)"
      github-environment-apply:
        type: string
        description: "github environment for the apply job (prod only; omit for prep)"
      allow-apply:
        type: boolean
        description: "whether the apply step is enabled. defaults to true on main"
        default: ${{ github.ref == 'refs/heads/main' }}
      creds-aws-region:
        type: string
        description: creds for aws, specifies the region
        required: true
      creds-aws-role-arn-plan:
        type: string
        description: "oidc role arn for the plan job (readonly)"
        required: true
      creds-aws-role-arn-apply:
        type: string
        description: "oidc role arn for the apply job"
        required: true

permissions:
  id-token: write # required for oidc
  contents: read

jobs:
  install:
    uses: ./.github/workflows/.install.yml

  plan:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-environment-plan }}
    needs: [install]
    # opt into the readonly plan grant for every step in this job (tunnel + plan
    # both call getConfig): under plan the oidc role can read only the for-plan
    # db credential, so config must select it and tolerate the denied secrets.
    env:
      GRANT: plan
    outputs:
      has-changes-planned: ${{ steps.evaluate-plan.outputs.has-changes-planned }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: node-modules cache get
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
          fail-on-cache-miss: true

      - name: get aws auth
        if: ${{ inputs.creds-aws-role-arn-plan }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn-plan }}
          aws-region: ${{ inputs.creds-aws-region }}

      # register the ghlitch operator role so `rhx use.vpc.tunnel` resolves
      - name: prepare:rhachet
        run: npm run prepare:rhachet --if-present

      - name: vpc:tunnel:open
        run: npx rhx use.vpc.tunnel --env ${{ inputs.stage }}

      - name: plan
        run: |
          set -o pipefail
          ACCESS=${{ inputs.stage }} npm run provision:schema:plan | tee ./plan.log

      - name: evaluate plan
        id: evaluate-plan
        run: |
          # check that there was not a connection error
          if grep "connect ETIMEDOUT" ./plan.log
          then
            echo "🛑 connection timed out, could not execute plan. is vpc tunnel working?"
            exit 1
          fi

          # check whether it said there were required changes
          if grep "Everything is up to date" ./plan.log
          then
            echo "has-changes-planned=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes-planned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: has changes planned?
        run: echo "${{ steps.evaluate-plan.outputs.has-changes-planned }}"

  apply:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-environment-apply }}
    needs: [install, plan]
    if: ${{ inputs.allow-apply == true && needs.plan.outputs.has-changes-planned == 'true' }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: node-modules cache get
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
          fail-on-cache-miss: true

      - name: get aws auth
        if: ${{ inputs.creds-aws-role-arn-apply }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn-apply }}
          aws-region: ${{ inputs.creds-aws-region }}

      # register the ghlitch operator role so `rhx use.vpc.tunnel` resolves
      - name: prepare:rhachet
        run: npm run prepare:rhachet --if-present

      - name: vpc:tunnel:open
        run: npx rhx use.vpc.tunnel --env ${{ inputs.stage }}

      - name: apply
        run: ACCESS=${{ inputs.stage }} npm run provision:schema:apply
