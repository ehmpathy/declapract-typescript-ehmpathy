name: .declastruct

# .what = reusable declastruct plan/apply for a wish, against either a github-app or an
#   aws-oidc backend. one workflow, two auth models — each auth step fires only when its
#   creds are supplied.
# .why = declastruct wishes share the plan->artifact->apply shape regardless of backend;
#   only the auth differs. github-provider wishes auth via a github-app token; aws-provider
#   wishes auth via oidc role assumption (with a plan/apply role split — plan readonly, apply
#   writer) + the ACCESS envar (read by the wish via sdk-environment). the plan is uploaded as
#   an artifact so apply executes the EXACT plan reviewers saw.

on:
  workflow_call:
    inputs:
      wish-path:
        type: string
        description: "the path to the wish declaration"
        required: true
      scope:
        type: string
        description: "the provider backend this wish targets (github | aws); scopes the plan artifact name"
        required: true
      access:
        type: string
        description: "the access tier this wish targets (test | prep | prod); read by the wish via sdk-environment as the ACCESS envar (aws wishes), and scopes the plan artifact name so parallel calls do not collide"
        required: true
      github-environment-plan:
        type: string
        description: "github environment for the plan job (empty = no env gate)"
      github-environment-apply:
        type: string
        description: "github environment for the apply job (empty = no env gate)"
      allow-apply:
        type: boolean
        description: "whether the apply step is enabled. defaults to true on main"
        default: ${{ github.ref == 'refs/heads/main' }}
      creds-github-app-owner:
        type: string
        required: false
        description: "github-app wishes: the owner of the github app to generate a token for"
      creds-github-app-id:
        type: string
        required: false
        description: "github-app wishes: the id of the github app to generate a token for"
      creds-aws-region:
        type: string
        required: false
        description: "aws wishes: the aws region for oidc auth"
      creds-aws-role-arn-plan:
        type: string
        required: false
        description: "aws wishes: oidc role arn for the plan job (readonly — DescribeParameters, no kms:Decrypt)"
      creds-aws-role-arn-apply:
        type: string
        required: false
        description: "aws wishes: oidc role arn for the apply job (writer — PutParameter, kms:Encrypt)"
    secrets:
      creds-github-app-private-key:
        required: false
        description: "github-app wishes: the private key of the github app to generate a token for"

permissions:
  id-token: write # required for aws oidc (unused by github-app wishes)
  contents: read

jobs:
  install:
    uses: ./.github/workflows/.install.yml

  plan:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-environment-plan }}
    needs: [install]
    env:
      ACCESS: ${{ inputs.access }} # aws wishes: sdk-environment getEnvironment reads ACCESS
    outputs:
      has-changes-planned: ${{ steps.evaluate-plan.outputs.has-changes-planned }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
          fail-on-cache-miss: true

      - name: get github auth, if creds supplied
        if: ${{ inputs.creds-github-app-id }}
        id: github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          owner: ${{ inputs.creds-github-app-owner }}
          repositories: ${{ github.event.repository.name }}
          app-id: ${{ inputs.creds-github-app-id }}
          private-key: ${{ secrets.creds-github-app-private-key }}

      - name: get aws auth, if creds supplied
        if: ${{ inputs.creds-aws-role-arn-plan }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn-plan }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: declastruct plan
        id: plan
        run: |
          set -o pipefail
          npx declastruct plan --wish ${{ inputs.wish-path }} --into ${{ inputs.wish-path }}.plan.json | tee ./plan.log
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}

      - name: evaluate plan
        id: evaluate-plan
        run: |
          # declastruct prints this exact phrase when there is no diff
          if grep "in sync" ./plan.log
          then
            echo "has-changes-planned=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes-planned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: has changes planned?
        run: echo "${{ steps.evaluate-plan.outputs.has-changes-planned }}"

      - name: upload plan artifact
        if: ${{ inputs.allow-apply == true && steps.evaluate-plan.outputs.has-changes-planned == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: declastruct-${{ inputs.scope }}-${{ inputs.access }}-plan
          path: |
            ${{ inputs.wish-path }}.plan.json
          retention-days: 1
          include-hidden-files: false

  apply:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-environment-apply }}
    needs: [install, plan]
    if: ${{ inputs.allow-apply == true && needs.plan.outputs.has-changes-planned == 'true' }}
    env:
      ACCESS: ${{ inputs.access }} # aws wishes: sdk-environment getEnvironment reads ACCESS
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set node-version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: get node-modules from cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
          fail-on-cache-miss: true

      - name: extract directory from wish-path
        id: extract-dir
        run: echo "wish-dir=$(dirname "${{ inputs.wish-path }}")" >> "$GITHUB_OUTPUT"

      - name: download plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: declastruct-${{ inputs.scope }}-${{ inputs.access }}-plan
          path: ${{ steps.extract-dir.outputs.wish-dir }}

      - name: get github auth, if creds supplied
        if: ${{ inputs.creds-github-app-id }}
        id: github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          owner: ${{ inputs.creds-github-app-owner }}
          repositories: ${{ github.event.repository.name }}
          app-id: ${{ inputs.creds-github-app-id }}
          private-key: ${{ secrets.creds-github-app-private-key }}

      - name: get aws auth, if creds supplied
        if: ${{ inputs.creds-aws-role-arn-apply }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn-apply }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: declastruct apply
        run: |
          set -o pipefail
          npx declastruct apply --plan ${{ inputs.wish-path }}.plan.json | tee ./apply.log
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
