name: deploy

on:
  push:
    tags:
      - v*
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      access:
        description: 'which access do you want to deploy with?'
        type: choice
        options:
          - prep
          - prod
        required: true
        default: 'prep'
      thoroughly:
        description: 'should we run tests before this deployment?'
        type: choice
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }} # per [workflow] x [branch, tag] x [event]
  cancel-in-progress: true # only cancel work flows on non-latest commits

permissions:
  id-token: write # required for oidc; a called workflow cannot exceed its caller's grant
  contents: read

jobs:
  test:
    uses: ./.github/workflows/.test.yml
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.thoroughly == 'true'
    with:
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_PREP_OIDC_ROLE_ARN }} # use aws auth via oidc, if this repo supplies it
    secrets: inherit # keyrack firewall in .test.yml filters to declared keys

  prep:
    uses: ./.github/workflows/.deploy-expo.yml
    needs: [test]
    # dont deploy on merge to main by default, since builds are expensive
    if: |
      ((github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' && false) || github.event.inputs.access == 'prep') &&
      always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    with:
      access: prep
      github-environment: preparation # deployment:false keeps the gate and suppresses the PR-timeline spam
      build: development
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_PREP_OIDC_ROLE_ARN }}
    secrets:
      expo-token: ${{ secrets.EXPO_TOKEN }}

  prod:
    uses: ./.github/workflows/.deploy-expo.yml
    needs: [test]
    if: |
      ((startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch') || github.event.inputs.access == 'prod') &&
      always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    with:
      access: prod
      build: production
      github-environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'production-on-main' || 'production-on-else-apply' }} # main/tag => on-main; else => on-else-apply (actor_id-gated writer)
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_PROD_OIDC_APPLY_ROLE_ARN }}
      app-web-deployment-s3-bucket: s3://@declapract{variable.projectName}-@declapract{variable.infrastructureNamespaceId}-prod
    secrets:
      expo-token: ${{ secrets.EXPO_TOKEN }}
