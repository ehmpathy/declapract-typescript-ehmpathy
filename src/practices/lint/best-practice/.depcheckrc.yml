ignores:
  - "@src/*"
  - "@src/.*"
  # all rhachet packages (roles/brains churn as prepare:rhachet installs vary)
  - "rhachet*"
  # runtime deps of the ghlitch operator use.vpc.tunnel skill (installed under
  # .agent/repo=ghlitch via prepare:rhachet); no committed src imports them, so
  # depcheck cannot attribute them in the ci lint job where the skill is absent
  - declastruct-aws
  - declastruct-unix-network
  - declapract
  - declapract-typescript-ehmpathy
  - "@commitlint/config-conventional"
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - husky
  - tsx
  - tsc-alias
  - yalc
  - test-fns
  - type-fns
  # read by the test:lint:cycles command via `node -p "require('yaml')..."`; depcheck does not
  # parse npm commands, so it cannot attribute the require
  - yaml
ignorePatterns:
  # rhachet host-local runtime state (actor caches, plugin copies); gitignored,
  # never source, and its files import packages this repo does not use
  - .agent/.actors
  # rhachet links `.claude` into the enrolled actor's dir, so depcheck reaches the same
  # host-local cache through it; the link is not source either
  - .claude
  # role dirs vendored from other repos import their own origin's deps; only
  # this repo's own role dir is source that depcheck should attribute
  - .agent/repo=*
  - "!.agent/repo=.this"
