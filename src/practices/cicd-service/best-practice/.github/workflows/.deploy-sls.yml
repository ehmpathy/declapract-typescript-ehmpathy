name: .deploy-sls

on:
  workflow_call:
    inputs:
      stage:
        type: string
        description: "the stage to deploy to"
        required: true
      github-environment-apply:
        type: string
        description: "github environment for the deploy jobs (prod only; omit for prep — its oidc role is repo-scoped, no env claim)"
      creds-aws-region:
        description: "creds for aws, specifies the region"
        required: true
        type: string
      creds-aws-role-arn-apply:
        description: "oidc role arn for the deploy jobs"
        required: true
        type: string
      needs-vpn-for-acceptance:
        type: boolean
        description: whether or not this environment needs vpn access for acceptance tests
        required: false
        default: false
    secrets:
      pagerduty-integration-key:
        required: false
        description: enables sending pagerduty alarms on failure

permissions:
  id-token: write # required for oidc
  contents: read

jobs:
  install:
    uses: ./.github/workflows/.install.yml

  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-environment-apply }}
    needs: [install]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: configure aws credentials (oidc)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn-apply }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: node-modules cache get
        uses: actions/cache/restore@v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
          fail-on-cache-miss: true

      - name: deploy
        run: ACCESS=${{ inputs.stage }} DEPLOYER_NAME=$GITHUB_ACTOR npm run deploy

  assure:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-environment-apply }}
    needs: [install, deploy]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: configure aws credentials (oidc)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn-apply }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: node-modules cache get
        uses: actions/cache/restore@v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
          fail-on-cache-miss: true

      # register the ghlitch operator role so `rhx use.vpc.tunnel` resolves
      - name: prepare:rhachet
        if: inputs.needs-vpn-for-acceptance
        run: npm run prepare:rhachet --if-present

      - name: vpc:tunnel:open
        if: inputs.needs-vpn-for-acceptance
        run: npx rhx use.vpc.tunnel --env ${{ inputs.stage }}

      - name: test:acceptance
        run: ACCESS=${{ inputs.stage }} npm run test:acceptance

      - name: alarm on failure
        env:
          PAGERDUTY_INTEGRATION_KEY: ${{ secrets.pagerduty-integration-key }}
        if: failure() && env.PAGERDUTY_INTEGRATION_KEY
        uses: Entle/action-pagerduty-alert@0.2.0 # https://github.com/marketplace/actions/pagerduty-alert
        with:
          pagerduty-integration-key: "${{ secrets.pagerduty-integration-key }}"
          pagerduty-dedup-key: github_workflow_failed

  prune:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.github-environment-apply }}
    needs: [install, deploy]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set node-version
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: configure aws credentials (oidc)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.creds-aws-role-arn-apply }}
          aws-region: ${{ inputs.creds-aws-region }}

      - name: node-modules cache get
        uses: actions/cache/restore@v4
        with:
          path: ./node_modules
          key: ${{ needs.install.outputs.node-modules-cache-key }}
          fail-on-cache-miss: true

      - name: prune
        run: ACCESS=${{ inputs.stage }} DEPLOYER_NAME=$GITHUB_ACTOR npm run deploy:prune
