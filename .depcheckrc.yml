ignores:
  - "@src/*"
  - "@src/.*"
  # all rhachet packages (roles/brains churn as prepare:rhachet installs vary)
  - "rhachet*"
  # runtime deps of role skills installed via prepare:rhachet (ghlitch tunnel,
  # bhrowser playwright); no committed src imports them, so depcheck cannot
  # attribute them in the lint job where the skills live under .agent/
  - declastruct-aws
  - declastruct-unix-network
  - playwright
  - declapract
  - declapract-typescript-ehmpathy
  - "@commitlint/config-conventional"
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - husky
  - tsx
  - tsc-alias
  - yaml
  - yalc
  - test-fns
  # consumer-runtime deps imported ONLY by best-practice env templates (e.g.
  # tests-expo/best-practice/jest.acceptance.env.ts), never by this library's own
  # executed src. depcheck reaches the template file and mis-attributes its
  # consumer-bound imports as this repo's absent deps.
  - "@jest/globals"
  - isomorphic-fetch
  - type-fns
ignorePatterns:
  # the lint bad-practice eslintrc is a forbidden-pattern template declapract
  # ships, never a real dep consumer. depcheck reaches it at its canonical src
  # path AND via the per-practice symlink mirrors in test-asset fixtures (e.g.
  # src/.test/assets/expo-fullusecase/declarations/practices/lint -> src/practices/lint),
  # so the glob spans both with a `**/` prefix.
  - "**/practices/lint/bad-practices/*"
  # the persist-with-rds test-asset fixtures are consumer repos (and retired templates) that
  # import `pg` as a consumer would; this library never runs them, so they are never its deps
  - "**/practices/persist-with-rds/**/.test/assets/**"
  # rhachet host-local runtime state (actor caches, plugin copies); gitignored,
  # never source, and its files import packages this repo does not use
  - .agent/.actors
  # rhachet links `.claude` into the enrolled actor's dir, so depcheck reaches the same
  # host-local cache through it; the link is not source either
  - .claude
  # role dirs vendored from other repos import their own origin's deps; only
  # this repo's own role dir is source that depcheck should attribute
  - .agent/repo=*
  - "!.agent/repo=.this"
